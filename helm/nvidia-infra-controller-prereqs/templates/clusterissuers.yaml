{{/*
SPDX-FileCopyrightText: Copyright (c) 2026 Red Hat, Inc. All rights reserved.
SPDX-License-Identifier: Apache-2.0

CA-based ClusterIssuers for development.
Creates a self-signed root CA, then ClusterIssuers that issue
leaf certificates from that CA. All NICo services share the
same trust root, enabling mTLS with host verification.

In production, replace with Vault PKI or ACME issuers.
*/}}

{{- if .Values.clusterIssuers.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-setup-issuers
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "nvidia-infra-controller-prereqs.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "10"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 30
  ttlSecondsAfterFinished: 300
  template:
    spec:
      restartPolicy: OnFailure
      serviceAccountName: {{ .Release.Name }}-setup-issuers
      containers:
        - name: setup
          image: registry.redhat.io/ubi9/ubi-minimal:latest
          command:
            - /bin/sh
            - -c
            - |
              TOKEN=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)
              API=https://kubernetes.default.svc
              CA=/var/run/secrets/kubernetes.io/serviceaccount/ca.crt
              HDRFILE=$(mktemp)
              chmod 600 "$HDRFILE"
              printf 'Authorization: Bearer %s\n' "$TOKEN" > "$HDRFILE"
              trap 'rm -f "$HDRFILE"' EXIT
              unset TOKEN

              wait_crd() {
                echo "Waiting for CRD $1..."
                until curl -sf --cacert "$CA" \
                    -H @"$HDRFILE" \
                    "$API/apis/apiextensions.k8s.io/v1/customresourcedefinitions/$1" \
                    >/dev/null 2>&1; do
                  sleep 5
                done
                echo "CRD $1 available"
              }

              sa() {
                curl -sf --cacert "$CA" \
                  -H @"$HDRFILE" \
                  -H "Content-Type: application/apply-patch+yaml" \
                  -X PATCH \
                  "$API$1?fieldManager=prereqs-hook&force=true" \
                  -d "$2" >/dev/null || { echo "Failed to apply $1"; exit 1; }
              }

              wait_crd clusterissuers.cert-manager.io
              wait_crd certificates.cert-manager.io

              echo "Waiting for cert-manager webhook..."
              until curl -sf --cacert "$CA" \
                  -H @"$HDRFILE" \
                  "$API/api/v1/namespaces/cert-manager/pods?labelSelector=app%3Dcert-manager" \
                  2>/dev/null | grep -q '"phase".*"Running"'; do
                sleep 5
              done
              sleep 10

              echo "Applying ClusterIssuers and root CA Certificate..."
              sa /apis/cert-manager.io/v1/clusterissuers/nico-bootstrap-issuer \
                '{"apiVersion":"cert-manager.io/v1","kind":"ClusterIssuer","metadata":{"name":"nico-bootstrap-issuer"},"spec":{"selfSigned":{}}}'

              sa /apis/cert-manager.io/v1/namespaces/cert-manager/certificates/nico-root-ca \
                '{"apiVersion":"cert-manager.io/v1","kind":"Certificate","metadata":{"name":"nico-root-ca","namespace":"cert-manager"},"spec":{"isCA":true,"commonName":"nico-root-ca","secretName":"nico-root-ca-secret","duration":"87600h0m0s","renewBefore":"8760h0m0s","privateKey":{"algorithm":"ECDSA","size":256},"issuerRef":{"name":"nico-bootstrap-issuer","kind":"ClusterIssuer","group":"cert-manager.io"}}}'

              sa /apis/cert-manager.io/v1/clusterissuers/nico-rest-ca-issuer \
                '{"apiVersion":"cert-manager.io/v1","kind":"ClusterIssuer","metadata":{"name":"nico-rest-ca-issuer"},"spec":{"ca":{"secretName":"nico-root-ca-secret"}}}'

              echo "Waiting for ClusterIssuers to be ready..."
              until curl -sf --cacert "$CA" \
                  -H @"$HDRFILE" \
                  "$API/apis/cert-manager.io/v1/clusterissuers/nico-rest-ca-issuer" \
                  2>/dev/null | grep -q '"status":.*"True"'; do
                sleep 5
              done
              echo "ClusterIssuers ready"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-setup-issuers
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "nvidia-infra-controller-prereqs.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Name }}-setup-issuers
  labels:
    {{- include "nvidia-infra-controller-prereqs.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}-setup-issuers
    namespace: {{ .Release.Namespace }}
{{- end }}
