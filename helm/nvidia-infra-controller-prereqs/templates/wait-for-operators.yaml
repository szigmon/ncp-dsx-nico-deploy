SPDX-FileCopyrightText: Copyright (c) 2026 Red Hat, Inc. All rights reserved.
SPDX-License-Identifier: Apache-2.0

Waits for operator CRDs to be available before Crunchy PostgreSQL
clusters and cert-manager Certificates can be created.
*/}}

{{- if or .Values.certManager.enabled .Values.crunchyPostgres.enabled .Values.externalSecrets.enabled .Values.metallb.enabled .Values.nmstate.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-wait-operators
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "nvidia-infra-controller-prereqs.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "-25"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Name }}-wait-operators
  labels:
    {{- include "nvidia-infra-controller-prereqs.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "-25"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}-wait-operators
    namespace: {{ .Release.Namespace }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-wait-operators
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "nvidia-infra-controller-prereqs.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "-20"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 60
  ttlSecondsAfterFinished: 300
  template:
    spec:
      restartPolicy: OnFailure
      serviceAccountName: {{ .Release.Name }}-wait-operators
      containers:
        - name: wait
          image: registry.redhat.io/ubi9/ubi-minimal:latest
          command:
            - /bin/sh
            - -c
            - |
              TOKEN=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)
              API=https://kubernetes.default.svc
              CA=/var/run/secrets/kubernetes.io/serviceaccount/ca.crt
              HDRFILE=$(mktemp)
              chmod 600 "$HDRFILE"
              printf 'Authorization: Bearer %s\n' "$TOKEN" > "$HDRFILE"
              trap 'rm -f "$HDRFILE"' EXIT
              unset TOKEN

              wait_crd() {
                echo "Waiting for CRD $1..."
                until curl -sf --cacert "$CA" \
                    -H @"$HDRFILE" \
                    "$API/apis/apiextensions.k8s.io/v1/customresourcedefinitions/$1" \
                    >/dev/null 2>&1; do
                  sleep 5
                done
                echo "CRD $1 available"
              }

              sa() {
                curl -sf --cacert "$CA" \
                  -H @"$HDRFILE" \
                  -H "Content-Type: application/apply-patch+yaml" \
                  -X PATCH \
                  "$API$1?fieldManager=prereqs-hook&force=true" \
                  -d "$2" >/dev/null
              }
              {{- if .Values.crunchyPostgres.enabled }}
              wait_crd postgresclusters.postgres-operator.crunchydata.com
              {{- end }}
              {{- if .Values.certManager.enabled }}
              wait_crd certificates.cert-manager.io
              {{- end }}
              {{- if .Values.externalSecrets.enabled }}
              wait_crd externalsecrets.external-secrets.io
              wait_crd externalsecretsconfigs.operator.openshift.io
              echo "Waiting for ExternalSecretsConfig API endpoint to be ready..."
              until curl -sf --cacert "$CA" \
                  -H @"$HDRFILE" \
                  "$API/apis/operator.openshift.io/v1alpha1/externalsecretsconfigs" \
                  >/dev/null 2>&1; do
                sleep 5
              done
              echo "Creating ExternalSecretsConfig operand..."
              until curl -s --cacert "$CA" \
                  -H @"$HDRFILE" \
                  -H "Content-Type: application/json" \
                  -X POST \
                  "$API/apis/operator.openshift.io/v1alpha1/externalsecretsconfigs" \
                  -d '{"apiVersion":"operator.openshift.io/v1alpha1","kind":"ExternalSecretsConfig","metadata":{"name":"cluster"},"spec":{"managementState":"Managed"}}' \
                  -o /dev/null -w "%{http_code}" | grep -qE "^(201|409)$"; do
                echo "Retrying ExternalSecretsConfig creation..."
                sleep 5
              done
              echo "ExternalSecretsConfig created — ESO controller will deploy"
              {{- end }}
              {{- if .Values.metallb.enabled }}
              echo "Waiting for MetalLB CRDs..."
              until oc get crd ipaddresspools.metallb.io > /dev/null 2>&1; do
                sleep 5
              done
              echo "MetalLB CRDs available"
              {{- end }}
              {{- if .Values.nmstate.enabled }}
              echo "Waiting for NMState CRD..."
              until oc get crd nmstates.nmstate.io > /dev/null 2>&1; do
                sleep 5
              done
              echo "Creating NMState operand..."
              cat <<EONMS | oc apply -f -
              apiVersion: nmstate.io/v1
              kind: NMState
              metadata:
                name: nmstate
              EONMS
              echo "Waiting for NodeNetworkConfigurationPolicy CRD..."
              until oc get crd nodenetworkconfigurationpolicies.nmstate.io > /dev/null 2>&1; do
                sleep 5
              done
              echo "NMState ready — NNCP CRD available"
              {{- end }}
              echo "All operator CRDs ready"
{{- end }}
