#
# Example per-site Core overlay: add site-specific config and enable MetalLB.
# Copy to nico-core-<site>.yaml, layer after nico-core.yaml.
#
# IMPORTANT: All IP values (VIP, DNS, PXE) come from deploy.env env vars only.
# This file has empty IP fields — do NOT hand-edit them. Instead:
#   cp deploy.env.example deploy.env  &&  edit IPs in deploy.env  &&
#   make deploy-dataplane-vip SITE=<site>
#
# The make targets override the empty values via helm --set using DATAPLANE_VIP.
# All services share one IP on different ports (API 443, PXE 8080, DNS 53, DHCP 67).
#
# Edit the siteConfig and forwarders sections in this file per site; the IPs are
# handled entirely by the make targets and deploy.env.

nico-api:
  externalService:
    enabled: true
    annotations:
      metallb.universe.tf/loadBalancerIPs: ""   # Set via DATAPLANE_VIP env var
  # Agents dial the VIP by IP, so carry an IP SAN. (Alternatively use a DNS name
  # served by unbound below + the chart's extraDnsNames, and drop this.)
  certificate:
    ipAddresses:
      - ""                                       # Set via DATAPLANE_VIP env var

nico-pxe:
  externalService:
    enabled: true
    annotations:
      metallb.universe.tf/loadBalancerIPs: ""   # Set via DATAPLANE_VIP env var (shared with other services)

unbound:
  enabled: true
  externalService:
    enabled: true
    annotations:
      metallb.universe.tf/loadBalancerIPs: ""   # Set via DATAPLANE_VIP env var (shared with other services)
  localConfig:
    forwarders.conf: |
      forward-zone:
          name: .
          forward-addr: <upstream-dns>      # site recursive resolver
  localData:
    - name: nico-pxe.forge
      addresses: [""]            # Set via DATAPLANE_VIP env var (localData[0])
    - name: carbide-api.forge
      addresses: [""]            # Set via DATAPLANE_VIP env var (localData[1])

# nico-dhcp on the shared VIP (different port: 67 vs API 443, PXE 8080, DNS 53).
# All services share DATAPLANE_VIP via MetalLB allow-shared-ip annotation.
nico-dhcp:
  externalService:
    enabled: true
    annotations:
      metallb.universe.tf/loadBalancerIPs: ""   # Set via DATAPLANE_VIP env var (shared with other services)
  config:
    kea:
      hookParameters:
        nameservers: ""          # Set via DATAPLANE_VIP env var (unbound's port 53)
        provisioningServer: ""   # Set via DATAPLANE_VIP env var (nico-pxe's port 8080)
        # ntpServer: omitted — nico-ntp is disabled here, so there is no NTP
        # service to advertise. Set it to a REACHABLE site NTP address if clients
        # need time sync (do not point it at the VIP).
