#
# Per-site infra-site override for the nico-lab SNO (VLAN 712, 10.6.145.0/24):
# the MetalLB dataplane VIP and the static IP for the dataplane NIC.
# Usage: make deploy-site-infra SITE_INFRA_VALUES=helm/values/infra-site-nico-lab.yaml
metallb:
  enabled: true
  # Range (not a single /32): per-service LB IPs — nico-api .100, nico-pxe .101,
  # unbound .102 (pinned via loadBalancerIPs in helm/values/nico-core-nico-lab.yaml).
  addresses:
    - 10.6.145.100-10.6.145.110
  interfaces:
    - enp3s0

nodeNetwork:
  enabled: true
  interface: enp3s0
  address: 10.6.145.2
  prefixLength: 24
