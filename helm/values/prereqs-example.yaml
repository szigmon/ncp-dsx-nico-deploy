# Example prereqs override enabling the MetalLB + kubernetes-nmstate operators
# for a site that exposes NICo services on a dedicated provisioning VLAN.
# Usage: make deploy-prereqs PREREQS_VALUES=helm/values/prereqs-<site>.yaml
metallb:
  enabled: true
nmstate:
  enabled: true
