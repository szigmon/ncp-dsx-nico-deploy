#
# The nico-ssh-console-rs external (LoadBalancer) Service hardcodes targetPort
# 22, but the console binds :2222 (ambient-cap workaround, see nico-core.yaml).
# Point the VIP's targetPort at the real listener. JSON patch.
- op: replace
  path: /spec/ports/0/targetPort
  value: 2222
